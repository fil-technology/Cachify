name: CachifyApp
options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 13.0
    PRODUCT_NAME: Cachify
    PRODUCT_BUNDLE_IDENTIFIER: fil.technology.cachify
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  CachifyApp:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
        buildPhase: resources
    entitlements:
      path: App/CachifyApp.entitlements
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cachify
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © Fil Technology
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
